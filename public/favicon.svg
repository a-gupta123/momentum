<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Momentum">
  <!--
    The same three ascending bars as BrandMark, on a rounded tile so the mark
    reads at 16px in a tab strip. Colors are literal here rather than tokens:
    a favicon is fetched outside the document and has no access to CSS
    variables, and the mid-blue works on both light and dark browser chrome.
  -->
  <rect width="32" height="32" rx="8" fill="#1d4ed8" />
  <rect x="6.5" y="18" width="5" height="8" rx="2" fill="#fff" opacity="0.5" />
  <rect x="13.5" y="12.5" width="5" height="13.5" rx="2" fill="#fff" opacity="0.75" />
  <rect x="20.5" y="6" width="5" height="20" rx="2" fill="#fff" />
</svg>
